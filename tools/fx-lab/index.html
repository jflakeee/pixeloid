<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixeloid FX lab</title><style>body{background:#101b24;color:#eff4ec;font:16px system-ui;margin:24px}button{min-height:48px;padding:12px;margin:6px;border-radius:8px;background:#20313b;color:inherit;border:1px solid #567}canvas{width:min(100%,640px);height:auto;image-rendering:pixelated;background:#17252f}p{max-width:680px}</style></head><body><h1>Pixeloid FX lab</h1><p>기존 게임과 분리된 실험실입니다. 버튼을 눌러 PixelFX 시각 효과와 PlinkFX 효과음을 시험합니다. 오디오 활성화는 사용자 제스처 이후에만 가능합니다.</p><canvas id="stage" width="320" height="200" aria-label="픽셀 이펙트 미리보기"></canvas><div><button data-fx="hit">광물 타격</button><button data-fx="reward">보상 획득</button><button id="mute" aria-pressed="false">소리 켬</button></div><p id="status" role="status" aria-live="polite">대기 중</p><script type="module" src="./main.js"></script></body></html>
