name: P0 persistence validation (branch only)
on:
  push:
    branches: [docs/map-systems-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check dist/core.mjs
          node --check dist/app.mjs
          node --check dist/input.mjs
          node --check dist/storage.mjs
          node --check tests/p0-persistence.mjs
      - name: Existing regression suite
        run: node test.mjs
      - name: P0 failure injection suite
        run: node tests/p0-persistence.mjs
