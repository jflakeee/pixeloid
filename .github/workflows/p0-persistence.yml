name: P0 persistence validation (branch only)
on:
  push:
    branches: [docs/map-systems-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check dist/core.mjs
          node --check dist/app.mjs
          node --check dist/input.mjs
          node --check dist/storage.mjs
          node --check dist/writer-gate.mjs
          node --check tests/p0-persistence.mjs
          node --check dist/region-prototype.mjs
          node --check dist/world-prototype.mjs
          node --check dist/excavation-prototype.mjs
          node --check dist/world-store-prototype.mjs
          node --check tests/p2-world-store-browser.mjs
      - name: Existing regression suite
        run: node test.mjs
      - name: P0 failure injection suite
        run: node tests/p0-persistence.mjs
      - name: Browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium integration
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/p0-browser.mjs
          node tests/p2-world-store-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-mobile
          path: p0-mobile.png
