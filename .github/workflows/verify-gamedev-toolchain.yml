name: Verify pinned game tool sources
on:
  push:
    branches: [chore/install-gamedev-toolchain-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Confirm six pinned checkouts and licenses
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C third_party/gamedev/awesome-gamedev-agent-skills rev-parse HEAD)" = "c6ca6c41c839b68319ffc08430b99ab768debc32"
          test -f third_party/gamedev/awesome-gamedev-agent-skills/README.md
          test -f third_party/gamedev/awesome-gamedev-agent-skills/LICENSE
          test "$(git -C third_party/gamedev/claude-code-game-studios rev-parse HEAD)" = "abc0de79d6ceb0b5d7aa693945849b3937afbe6a"
          test -f third_party/gamedev/claude-code-game-studios/README.md
          test -f third_party/gamedev/claude-code-game-studios/LICENSE
          test "$(git -C third_party/gamedev/claude-gamedev-kit rev-parse HEAD)" = "86b5b6ddd33a542ef4ca1cc2de067feb82763cc2"
          test -f third_party/gamedev/claude-gamedev-kit/README.md
          test -f third_party/gamedev/claude-gamedev-kit/LICENSE
          test "$(git -C third_party/gamedev/dream-loop rev-parse HEAD)" = "9bddb901f7d071cfefdd21e264267c757177a9df"
          test -f third_party/gamedev/dream-loop/README.md
          test -f third_party/gamedev/dream-loop/LICENSE
          test "$(git -C third_party/gamedev/plinkfx rev-parse HEAD)" = "7e5f6a477037679a29df9c5141e9853b1267e7d8"
          test -f third_party/gamedev/plinkfx/README.md
          test -f third_party/gamedev/plinkfx/LICENSE
          test "$(git -C third_party/gamedev/pixelfx rev-parse HEAD)" = "5294518ce7c72e48b6100a744596e0acf57f2826"
          test -f third_party/gamedev/pixelfx/README.md
          test -f third_party/gamedev/pixelfx/LICENSE
          git submodule status
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check installer and existing game regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup-gamedev-toolchain.sh
          test "$(grep -c 'submodule "' .gitmodules)" -eq 6
          node --check dist/app.mjs
          node test.mjs
          node tests/p0-persistence.mjs
      - name: Build isolated PixelFX and PlinkFX preview
        shell: bash
        run: |
          set -euo pipefail
          cd tools/fx-lab
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          node feedback-events.test.mjs
          test -s ../../dist/fx-runtime.mjs
          test $(wc -c < ../../dist/fx-runtime.mjs) -lt 1500000
          node --check ../../dist/fx-runtime.mjs
          test -s build/main.js
          test -s build/index.html
      - name: Chromium mobile FX smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd tools/fx-lab
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.0
          npx playwright install chromium
          python3 -m http.server 8766 --bind 127.0.0.1 --directory build &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/ >/dev/null && break; sleep 1; done
          node browser-test.mjs
          python3 -m http.server 8767 --bind 127.0.0.1 --directory ../../dist &
          game_server=$!
          trap 'kill "$server" "$game_server" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8767/ >/dev/null && break; sleep 1; done
          node game-browser-test.mjs
      - name: Verify release candidate includes compiled FX and required game files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/app.mjs
          test -s dist/feedback-events.mjs
          test -s dist/fx-runtime.mjs
          node --check dist/app.mjs
          node --check dist/feedback-events.mjs
          node --check dist/fx-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pixeloid-fx-release-candidate
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pixeloid-fx-lab
          path: |
            tools/fx-lab/build/
            tools/fx-lab/fx-lab-mobile.png
            tools/fx-lab/game-fx-mobile.png
            dist/fx-runtime.mjs
